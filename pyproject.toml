    "pyarrow>=15.0.0",
    "delta-spark>=3.2.0",
    "pandas>=2.2.0",
    "jupyterlab>=4.2.0"
]

[project.optional-dependencies]
dev = ["pytest>=8.2.0", "chispa>=0.9.4", "ruff>=0.5.0"]
